<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Web</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}
/* CSS để định vị nút quay về trang chủ */
        .back-home {
            position: fixed; /* Cố định vị trí */
            bottom: 20px;    /* Cách mép dưới 20px */
            right: 20px;     /* Cách mép phải 20px */
            background-color: #333; /* Màu nền */
            color: white;    /* Màu chữ */
            padding: 10px 15px;
            text-decoration: none; /* Bỏ gạch chân */
            border-radius: 5px;    /* Bo góc */
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 1000;   /* Luôn nằm trên các phần tử khác */
        }

        .back-home:hover {
            background-color: #555; /* Đổi màu khi di chuột vào */
        }
body{
    background:#0f172a;
    color:white;
    display:flex;
    height:100vh;
}

/* MENU TRÁI */
.sidebar{
    width:250px;
    background:#111827;
    border-right:2px solid #00e5ff;
    padding:20px;
}

.sidebar h2{
    color:#00e5ff;
    margin-bottom:20px;
}

.music-btn{
    width:100%;
    padding:15px;
    margin-bottom:10px;
    background:#1e293b;
    border:1px solid #00e5ff;
    color:white;
    cursor:pointer;
    border-radius:10px;
    transition:0.3s;
}

.music-btn:hover{
    background:#00e5ff;
    color:black;
}

/* KHUNG PHẢI */
.content{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.player-box{
    width:80%;
    height:500px;
    background:#111827;
    border:2px solid #00e5ff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,229,255,0.4);
}

.player-box h1{
    color:#00e5ff;
    margin-bottom:20px;
}

/* iframe nhạc */
iframe{
    width:100%;
    height:400px;
    border:none;
    border-radius:10px;
}
</style>
</head>
<body>

<!-- MENU BÊN TRÁI -->
<div class="sidebar">
    <h2>🎵 Menu Nhạc</h2>

    <button class="music-btn"
    onclick="playMusic('nhacphim.mp4')">
        Nhạc 
    </button>

    <button class="music-btn"
    onclick="playMusic('lofi.mp4')">
        Lofi
    </button>

    <button class="music-btn"
    onclick="playMusic('remix.mp4')">
        remix
    </button>

</div>

<!-- KHUNG BÊN PHẢI -->
<div class="content">

    <div class="player-box">
        <h1>🎧 Trình phát nhạc</h1>

        <!-- KHUNG NHẠC -->
        <iframe id="musicFrame"
        src=""
        allowfullscreen>
        </iframe>

    </div>

</div>

<script>
function playMusic(link){
    document.getElementById("musicFrame").src = link;
}
</script>
<!-- Nút quay về trang chủ -->
<a href="trangchu.html" class="back-home">🏠 Về trang chủ</a>
</body>
</html>
