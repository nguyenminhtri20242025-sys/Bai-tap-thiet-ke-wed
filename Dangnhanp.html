<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Đăng Nhập</title>
    <style>
        body
        {
            display: flex; justify-content: center; align-items: center; height: 100vh; background-color: rgb(57, 91, 165);
        }
        /* Khung chứa from chính*/
        .login-box
        {
            width: 400px;
            padding: 40px;
            background-color: rgb(231, 201, 162);
            border: 7px solid rgb(38, 25, 82);
            font-family: Arial, sans-serif;
        }
        /*Tiêu đề đăng nhập*/
        h2{ margin-top: 0;font-size: 24px;}
        /*Ô nhập dữ liệu*/
        input[type="text"],input[type="password"]
        {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border: 2px solid rgb(112, 18, 201);/*viền tím*/
            box-sizing:  border-box;
            font-size: 20px;
        }
        /*Lựa chọn giới tính và checkbox*/
        .checkbox-group
        {
            margin: 10px 0;
        }
        /*Nút đăng nhập*/
        button
        {
            background: #1165c5;/*nút bấm màu xanh biển*/
            color: aliceblue;
            padding: 10px 20px;
            border: 2px solid rgb(112, 18, 201);
            cursor: pointer;
            margin-top: 10px;
        }
        /* CSS để định vị nút quay về trang chủ */
        .back-home {
            position: fixed; /* Cố định vị trí */
            bottom: 20px;    /* Cách mép dưới 20px */
            right: 20px;     /* Cách mép phải 20px */
            background-color: #333; /* Màu nền */
            color: white;    /* Màu chữ */
            padding: 10px 15px;
            text-decoration: none; /* Bỏ gạch chân */
            border-radius: 5px;    /* Bo góc */
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 1000;   /* Luôn nằm trên các phần tử khác */
        }

        .back-home:hover {
            background-color: #555; /* Đổi màu khi di chuột vào */
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Đăng nhập</h2>
        <input type="text">
        <div><strong>Tên đăng nhập</strong></div>
        <input type="password">
        <div><strong>Mật khẩu</strong></div>

        <div class="checkbox-group">
            <input type="radio" name="gender" checked> Nam<br>
            <input type="radio" name="gender"> Nữ<br>
            <input type="checkbox"> Lưu giá trị đăng nhập
        </div>
        <button type="submit">Đăng nhập</button>
    </div>
    <!-- Nút quay về trang chủ -->
<a href="trangchu.html" class="back-home">🏠 Về trang chủ</a>
</body>
</html>
